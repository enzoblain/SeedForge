name: SeedForge

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            binary: seedforge

          - os: macos-15-intel
            name: macos-amd64
            binary: seedforge

          - os: macos-latest
            name: macos-arm64
            binary: seedforge

          - os: windows-latest
            name: windows-amd64
            binary: seedforge.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: latest

      - name: Show Odin version
        run: odin version

      - name: Build SeedForge
        run: odin build src -o:speed -out:${{ matrix.binary }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp "${{ matrix.binary }}" "dist/${{ matrix.name }}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seedforge-${{ matrix.name }}
          path: dist/${{ matrix.name }}/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create archives
        shell: bash
        run: |
          cd release

          for dir in */; do
            name="${dir%/}"
            tar -czf "../${name}.tar.gz" "$name"
          done

          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
